<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سورة مريم | الآيات ٧٧–٩٥</title>
<style>
:root{--gold:#d8bd78;--ink:#f8f3df;--muted:#bdc9d8;--panel:#10243c;--line:#314b68}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#203e60 0%,#0b1728 65%);color:var(--ink);font-family:"Noto Naskh Arabic","Amiri","Traditional Arabic",serif}
.top{padding:clamp(18px,2.5vw,34px) 4vw 20px;text-align:center;border-bottom:1px solid #d8bd7855;position:relative}
.kicker{font:600 clamp(11px,1vw,15px) Arial,sans-serif;letter-spacing:.24em;color:var(--gold);text-transform:uppercase}
h1{font-size:clamp(32px,4vw,58px);font-weight:600;margin:8px 0 2px;color:#fff7df}
.subtitle{font:clamp(13px,1.2vw,18px) Arial,sans-serif;color:var(--muted);margin:0}
.ornament{width:min(280px,30vw);height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:16px auto 0}
.shell{width:min(94vw,1700px);margin:clamp(16px,2vw,28px) auto}
.toolbar{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
button{border:1px solid #d8bd7880;border-radius:999px;padding:12px 24px;background:#d8bd78;color:#17263a;font:700 clamp(13px,1vw,17px) Arial,sans-serif;cursor:pointer}
button.secondary{background:#172d46;color:#f8f3df;border-color:#49627d}
button:hover{filter:brightness(1.1)}
#status{font:clamp(12px,1vw,16px) Arial,sans-serif;color:var(--gold);text-align:center;min-height:22px;margin:10px 0 18px}
.reading{background:linear-gradient(145deg,#fdf9e9,#f2ebd5);color:#102b4c;border:3px solid var(--gold);outline:1px solid #fff5d355;outline-offset:5px;border-radius:18px;padding:clamp(20px,3vw,48px);box-shadow:0 18px 60px #0006}
.basmala{text-align:center;color:#9a7838;font-size:clamp(24px,2.6vw,40px);margin:0 0 18px}
#verses{font-size:clamp(28px,3.25vw,53px);line-height:2.05;text-align:justify;text-align-last:center}
.ayah{display:inline;transition:background .2s,color .2s;border-radius:8px;padding:0 2px}
.ayah.active{background:#f3df9e;color:#071d39;box-shadow:0 0 0 3px #f3df9e}
.num{display:inline-flex;vertical-align:middle;align-items:center;justify-content:center;width:1.12em;height:1.12em;margin:0 .12em;border:1.5px solid #a88b4e;border-radius:50%;font-size:.48em;color:#896c32;white-space:nowrap}
.footer{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:22px 5px;color:var(--muted);font:clamp(11px,.9vw,14px) Arial,sans-serif}
.progress{height:4px;background:#ffffff22;border-radius:5px;overflow:hidden;margin-top:12px}
#bar{height:100%;width:0;background:var(--gold);transition:width .25s}
@media(min-width:1400px){.shell{width:92vw}.reading{padding:44px 6vw}#verses{font-size:clamp(48px,3.1vw,66px);line-height:2.12}}
@media(max-width:700px){.shell{width:94vw}.reading{padding:18px 15px}#verses{font-size:27px;line-height:2}.footer{justify-content:center;text-align:center}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="kicker">AL-QUR'AN AL-KAREEM</div>
  <h1>سُورَةُ مَرْيَمَ</h1>
  <p class="subtitle">الآيات من ٧٧ إلى ٩٥</p>
  <div class="ornament"></div>
</header>
<main class="shell">
  <div class="toolbar">
    <button id="all">▶ تشغيل متتابع</button>
    <button class="secondary" id="pause">Ⅱ إيقاف مؤقت</button>
    <button class="secondary" id="stop">■ إيقاف</button>
    <button class="secondary" id="full">⛶ ملء الشاشة</button>
  </div>
  <div id="status">جاري تحميل الآيات...</div>
  <section class="reading">
    <div class="basmala">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
    <div id="verses"></div>
  </section>
  <div class="progress"><div id="bar"></div></div>
  <div class="footer"><span>سورة مريم · الآيات ٧٧–٩٥</span><span>القارئ: مشاري العفاسي</span><span>اضغط على أي آية للاستماع إليها</span></div>
</main>
<audio id="audio" preload="none"></audio>
<script>
const first=77,last=95,audio=document.getElementById('audio'),statusBox=document.getElementById('status'),versesBox=document.getElementById('verses'),bar=document.getElementById('bar');
let current=0,continuous=false;
const arabicNumber=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[Number(d)]);
function highlight(n){
 document.querySelectorAll('.ayah').forEach(el=>el.classList.toggle('active',Number(el.dataset.n)===n));
 bar.style.width=n?((n-first+1)/(last-first+1)*100)+'%':'0%';
 const active=document.querySelector('.ayah.active');
 if(active)active.scrollIntoView({behavior:'smooth',block:'center'});
}
function play(n,chain=false){
 if(n>last){continuous=false;highlight(0);statusBox.textContent='اكتمل تشغيل جميع الآيات';return;}
 current=n;continuous=chain;highlight(n);
 statusBox.textContent='الآية '+arabicNumber(n)+' — جاري التشغيل';
 audio.src='https://everyayah.com/data/Alafasy_128kbps/019'+String(n).padStart(3,'0')+'.mp3';
 audio.play().catch(()=>statusBox.textContent='اضغط تشغيل مرة أخرى، وتأكد من اتصال الإنترنت');
}
fetch('https://api.alquran.cloud/v1/surah/19/quran-uthmani')
.then(r=>{if(!r.ok)throw Error();return r.json()})
.then(data=>{
 const selected=data.data.ayahs.filter(a=>a.numberInSurah>=first&&a.numberInSurah<=last);
 versesBox.innerHTML=selected.map(a=>'<span class="ayah" data-n="'+a.numberInSurah+'">'+a.text+' <span class="num">'+arabicNumber(a.numberInSurah)+'</span> </span>').join('');
 document.querySelectorAll('.ayah').forEach(el=>el.addEventListener('click',()=>play(Number(el.dataset.n),false)));
 statusBox.textContent='ആയത്ത് തിരഞ്ഞെടുക്കുക അല്ലെങ്കിൽ തുടർച്ചയായ പ്ലേ അമർത്തുക';
})
.catch(()=>statusBox.textContent='ആയത്തുകൾ ലഭ്യമാക്കാൻ ഇന്റർനെറ്റ് കണക്ഷൻ പരിശോധിക്കുക');
document.getElementById('all').onclick=()=>play(first,true);
document.getElementById('pause').onclick=()=>{audio.pause();statusBox.textContent='താൽക്കാലികമായി നിർത്തി'};
document.getElementById('stop').onclick=()=>{continuous=false;audio.pause();audio.currentTime=0;highlight(0);statusBox.textContent='നിർത്തി'};
document.getElementById('full').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};
audio.addEventListener('ended',()=>{if(continuous)play(current+1,true);else{highlight(0);statusBox.textContent='ആയത്ത് പ്ലേ ചെയ്തു കഴിഞ്ഞു'}});
audio.addEventListener('error',()=>statusBox.textContent='ഓഡിയോ ലഭ്യമല്ല. ഇന്റർനെറ്റ് പരിശോധിക്കുക.');
</script>
</body></html>
