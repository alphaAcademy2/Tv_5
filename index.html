*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;font-family:'Manjari',sans-serif;color:#f8fbff}
body{background:radial-gradient(ellipse at 15% 15%,#173a69 0%,transparent 42%),radial-gradient(ellipse at 85% 85%,#153d54 0%,transparent 38%),#07152f}
.wrap{min-height:100vh;padding:3vh 4vw;display:flex;flex-direction:column}

.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;width:min(1100px,100%);margin-top:4vh}
.card{min-height:230px;border:1px solid #ffffff25;border-radius:25px;padding:28px 18px;background:linear-gradient(145deg,#17365b,#102342);color:#fff;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;box-shadow:0 15px 35px #0004;transition:.2s}

.icon{font-size:clamp(42px,5vw,68px)}.card strong{font-size:clamp(24px,3vw,38px);color:#ffd166}.card span{font-size:clamp(15px,1.5vw,20px);color:#c4d2e8}
.panel{width:min(1150px,100%);border:1px solid #ffffff25;border-radius:25px;background:#10254aee;padding:clamp(22px,4vw,50px);margin-top:3vh}
.placeholder{border:2px dashed #69e2dc80;border-radius:20px;padding:clamp(30px,6vw,80px) 20px;color:#c4d2e8;font-size:clamp(20px,2.5vw,32px);line-height:1.7}
.note{font-size:clamp(15px,1.5vw,20px);color:#9be7b1;margin-top:22px}
footer{text-align:center;color:#9eb0ca;font-size:15px;padding:18px}
@media(max-width:700px){.cards{grid-template-columns:1fr}.card{min-height:150px}.wrap{padding:16px}}
